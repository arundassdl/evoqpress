- name: Install setuptools in agent virtualenv
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/pip install "setuptools<81" --upgrade
  args:
    chdir: /home/frappe/agent

- name: Upgrade Flask and Jinja2 for Python 3.12 compatibility
  become: yes
  become_user: frappe
  command: >
    /home/frappe/agent/env/bin/pip install
    "flask>=2.3.0"
    "jinja2>=3.1.0"
    "MarkupSafe>=2.0"
    --force-reinstall
  args:
    chdir: /home/frappe/agent

- name: Setup Agent Supervisor
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup supervisor
  args:
    chdir: /home/frappe/agent

- name: Reload supervisor configuration
  command: supervisorctl reread

- name: Update supervisor processes
  command: supervisorctl update

- name: Start Agent processes
  supervisorctl:
    name: "agent:"
    state: started
  register: agent_start
  failed_when: agent_start.failed and 'already started' not in agent_start.msg | default('')


- name: Create NGINX Root Configuration File
  become: yes
  become_user: frappe
  file:
    path: /home/frappe/agent/nginx/nginx.conf
    state: touch

- name: Symlink NGINX Root Configuration File
  file:
    src: /home/frappe/agent/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf
    state: link
    force: yes
    follow: no

- name: Create Agent NGINX Configuration File
  become: yes
  become_user: frappe
  file:
    path: /home/frappe/agent/nginx.conf
    state: touch

- name: Symlink Agent NGINX Configuration File
  file:
    src: /home/frappe/agent/nginx.conf
    dest: /etc/nginx/conf.d/agent.conf
    state: link
    force: yes
    follow: no

- name: Create Agent TLS Directory
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/agent/tls
    state: directory

- name: Setup Agent TLS (Private Key)
  become: yes
  become_user: frappe
  copy:
    #content: '{{ certificate_private_key }}'
    content: /etc/letsencrypt/live/evoq.app/privkey.pem
    dest: /home/frappe/agent/tls/privkey.pem

- name: Setup Agent TLS (Full Chain)
  become: yes
  become_user: frappe
  copy:
   # content: '{{ certificate_full_chain }}'
    content: /etc/letsencrypt/live/evoq.app/fullchain.pem
    dest: /home/frappe/agent/tls/fullchain.pem

- name: Setup Agent TLS (Intermediate Chain)
  become: yes
  become_user: frappe
  copy:
    #content: '{{ certificate_intermediate_chain }}'
    content: /etc/letsencrypt/live/evoq.app/chain.pem
    dest: /home/frappe/agent/tls/chain.pem

- name: Check if fullchain.pem is empty
  stat:
    path: /home/frappe/agent/tls/fullchain.pem
  register: fullchain_stat

- name: Fallback - Copy fullchain.pem from letsencrypt
  copy:
    src: /etc/letsencrypt/live/evoq.app/fullchain.pem
    dest: /home/frappe/agent/tls/fullchain.pem
    owner: frappe
    group: frappe
    remote_src: yes
  when: fullchain_stat.stat.size == 0

- name: Check if privkey.pem is empty
  stat:
    path: /home/frappe/agent/tls/privkey.pem
  register: privkey_stat

- name: Fallback - Copy privkey.pem from letsencrypt
  copy:
    src: /etc/letsencrypt/live/evoq.app/privkey.pem
    dest: /home/frappe/agent/tls/privkey.pem
    owner: frappe
    group: frappe
    remote_src: yes
  when: privkey_stat.stat.size == 0

- name: Check if chain.pem is empty
  stat:
    path: /home/frappe/agent/tls/chain.pem
  register: chain_stat

- name: Fallback - Copy chain.pem from letsencrypt
  copy:
    src: /etc/letsencrypt/live/evoq.app/chain.pem
    dest: /home/frappe/agent/tls/chain.pem
    owner: frappe
    group: frappe
    remote_src: yes
  when: chain_stat.stat.size == 0

- name: Setup Agent NGINX
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup nginx
  args:
    chdir: /home/frappe/agent

- name: Setup Monitoring Authentication
  become: yes
  become_user: frappe
  command: 'htpasswd -Bbc /home/frappe/agent/nginx/monitoring.htpasswd frappe {{ monitoring_password }}'
