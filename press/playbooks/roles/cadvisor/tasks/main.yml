- name: Set cAdvisor architecture
  set_fact:
    cadvisor_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    cadvisor_checksum:
      amd64: "c63976400ca980b4b34bd074ef93c5321650050e45e6dc4d0cb1baf7dc772639"
      arm64: "37c998d54dc0e8b1635d9be4c0ab15dfc3123aa41805ad0bd909c896d5a1a89b"

- name: Create cAdvisor directory
  file:
    path: /opt/cadvisor
    state: directory
    mode: '0755'

- name: Download cAdvisor Binary
  shell: |
    curl -fsSL \
      https://github.com/google/cadvisor/releases/download/v0.50.0/cadvisor-v0.50.0-linux-{{ cadvisor_arch }} \
      -o /opt/cadvisor/cadvisor
    echo "{{ cadvisor_checksum[cadvisor_arch] }}  /opt/cadvisor/cadvisor" | sha256sum -c -
  args:
    creates: /opt/cadvisor/cadvisor

- name: Set cAdvisor binary permissions
  file:
    path: /opt/cadvisor/cadvisor
    mode: '0755'
    owner: root
    group: root

- name: Create cAdvisor Systemd Service File
  template:
    src: cadvisor.service
    dest: /etc/systemd/system/cadvisor.service
    owner: root
    group: root
    mode: 0644

- name: Restart cAdvisor Service
  systemd:
    daemon_reload: true
    name: cadvisor
    enabled: yes
    state: restarted
