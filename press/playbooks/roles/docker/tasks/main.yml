- name: Ensure keyrings directory exists
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
    gpg --dearmor -o /usr/share/keyrings/docker.gpg
  args:
    creates: /usr/share/keyrings/docker.gpg

- name: Set Docker GPG key permissions
  file:
    path: /usr/share/keyrings/docker.gpg
    mode: '0644'

- name: Download NGINX GPG key
  shell: |
    curl -fsSL https://nginx.org/keys/nginx_signing.key | \
    gpg --dearmor -o /usr/share/keyrings/nginx.gpg
  args:
    creates: /usr/share/keyrings/nginx.gpg

- name: Set NGINX GPG key permissions
  file:
    path: /usr/share/keyrings/nginx.gpg
    mode: '0644'

- name: Add Docker Repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu focal stable"
    state: present
    update_cache: true

- name: Add NGINX Repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/nginx.gpg] https://nginx.org/packages/ubuntu focal nginx"
    state: present
    update_cache: true

- name: Install Docker
  apt:
    name: docker-ce
    state: present

- name: Add Frappe User to docker Group
  user:
    name: frappe
    groups:
      - docker
    append: true

- name: Setup Docker Metrics
  template:
    src: daemon.json
    dest: /etc/docker/daemon.json

- name: Create Docker SystemD drop-in directory
  file:
    dest: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: 0644
    recurse: true

- name: Set Docker to depend on Mounts
  template:
    src: mounts.conf
    dest: /etc/systemd/system/docker.service.d/mounts.conf
    owner: root
    group: root
    mode: 0644
  when: docker_depends_on_mounts | default(false) | bool

- name: Restart Docker Daemon
  systemd:
    daemon_reload: true
    name: docker
    state: restarted

- name: Get Docker Info
  command: docker info

